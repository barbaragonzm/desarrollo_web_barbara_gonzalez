<!DOCTYPE html>
<html lang="es">
<head>
    
    <title>¿Que hace la comunidad DCC en su tiempo libre?</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <a href="{{ url_for('inicio') }}">← Volver al inicio</a>
   <section id="metricas">
  <h1>Métricas de la Comunidad</h1>
  <p>
    En esta sección se muestran gráficos simulados sobre la distribución de miembros 
    por tipo y por actividades. Los valores son ficticios, pero ilustran cómo se verían las métricas en el sistema real.
  </p>

  <div style="max-width:600px; margin-bottom: 40px;">
    <canvas id="graficoTipos"></canvas>
  </div>

  <div style="max-width:600px;">
    <canvas id="graficoActividades"></canvas>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    // Datos simulados
    const tipos = ["Estudiante", "Funcionario", "Académico"];
    const conteoTipos = [456, 80, 74]; // números ficticios

    const actividades = ["Artística","Deportiva","Social","Recreativa","Académica","Tecnológica","Bienestar"];
    const conteoActividades = [200, 562, 68, 108, 234, 88, 78]; // números ficticios

    
    new Chart(document.getElementById("graficoTipos"), {
      type: 'bar',
      data: {
        labels: tipos,
        datasets: [{
          label: 'Número de miembros',
          data: conteoTipos,
          backgroundColor: ['#4e79a7','#f28e2b','#e15759']
        }]
      },
      options: { responsive: true, plugins: { legend: { display: false } } }
    });

    
    new Chart(document.getElementById("graficoActividades"), {
      type: 'pie',
      data: {
        labels: actividades,
        datasets: [{
          label: 'Número de miembros',
          data: conteoActividades,
          backgroundColor: ['#4e79a7','#f28e2b','#e15759','#76b7b2','#59a14f','#edc948','#b07aa1']
        }]
      },
      options: { responsive: true }
    });
  </script>
</section>
</body>
</html>
